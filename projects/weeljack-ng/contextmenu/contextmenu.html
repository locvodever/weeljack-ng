@let model = mapped();
@if (model.items.length > 0) {
  <p-contextmenu
    appendTo="body"
    [model]="model.items"
    [target]="target()"
    [global]="global()"
    [ariaLabel]="ariaLabel()"
    [ariaLabelledBy]="ariaLabelledBy()"
    [motionOptions]="motion"
    [pt]="partAttributes()"
    (onShow)="entered()"
    (onHide)="left()"
  >
    @if (itemSlot(); as slot) {
      <ng-template #item let-item>
        @let entry = model.source(item);
        @if (entry) {
          <a
            class="p-contextmenu-item-link"
            data-pc-section="itemlink"
            tabindex="-1"
            [attr.href]="entry.url"
            [attr.target]="entry.url ? entry.target : null"
          >
            <ng-container *ngTemplateOutlet="slot.template; context: { $implicit: entry }" />
          </a>
        }
      </ng-template>
    }
  </p-contextmenu>
}
