@let target = labelFor();
<div class="wj-field-box" [class.wj-field-inline]="inline()">
  @if (!inline()) {
    @if (target) {
      <label class="wj-field-label" [id]="labelId" [for]="target">{{ label() }}</label>
    } @else {
      <span class="wj-field-label" [id]="labelId">{{ label() }}</span>
    }
    @if (hint()) {
      <p class="wj-field-hint" [id]="hintElementId">{{ hint() }}</p>
    }
  }
  <ng-content />
  @if (inline()) {
    @if (target) {
      <label class="wj-field-label" [id]="labelId" [for]="target">{{ label() }}</label>
    } @else {
      <span class="wj-field-label" [id]="labelId">{{ label() }}</span>
    }
    @if (hint()) {
      <p class="wj-field-hint" [id]="hintElementId">{{ hint() }}</p>
    }
  }
  @if (errorText()) {
    <p class="wj-field-error" role="alert" [id]="errorElementId">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M8 4.5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="8" cy="11.25" r=".9" fill="currentColor" />
      </svg>
      <span>{{ errorText() }}</span>
    </p>
  }
</div>
