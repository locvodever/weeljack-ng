<p-inputnumber
  buttonLayout="horizontal"
  [inputId]="field.id()"
  [ariaLabel]="ariaLabel()"
  [ariaLabelledBy]="field.labelledBy()"
  [ariaDescribedBy]="field.describedBy()"
  [disabled]="isDisabled()"
  [required]="required()"
  [invalid]="field.invalid()"
  [placeholder]="placeholder()"
  [size]="size()"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [mode]="mode()"
  [currency]="currency()"
  [locale]="locale()"
  [minFractionDigits]="minFractionDigits()"
  [maxFractionDigits]="maxFractionDigits()"
  [prefix]="prefix()"
  [suffix]="suffix()"
  [showButtons]="showButtons()"
  [pt]="partAttributes()"
>
  <ng-template #decrementbuttonicon><svg data-p-icon="minus"></svg></ng-template>
  <ng-template #incrementbuttonicon><svg data-p-icon="plus"></svg></ng-template>
</p-inputnumber>
