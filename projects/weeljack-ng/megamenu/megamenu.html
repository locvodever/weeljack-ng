@let model = mapped();
<p-megamenu [model]="model.items" [orientation]="orientation()" [pt]="partAttributes()">
  @if (startSlot(); as slot) {
    <ng-template #start><ng-container *ngTemplateOutlet="slot.template" /></ng-template>
  }
  @if (endSlot(); as slot) {
    <ng-template #end><ng-container *ngTemplateOutlet="slot.template" /></ng-template>
  }
  @if (itemSlot(); as slot) {
    <ng-template #item let-item>
      @let entry = model.source(item);
      @if (entry) {
        <a
          class="p-megamenu-item-link"
          data-pc-section="itemlink"
          tabindex="-1"
          [attr.href]="entry.url"
          [attr.target]="entry.url ? entry.target : null"
        >
          <ng-container *ngTemplateOutlet="slot.template; context: { $implicit: entry }" />
        </a>
      }
    </ng-template>
  }
</p-megamenu>
