<p-datepicker
  iconDisplay="button"
  [inline]="inline()"
  [inputId]="field.id()"
  [ariaLabel]="ariaLabel()"
  [ariaLabelledBy]="field.labelledBy()"
  [disabled]="isDisabled()"
  [required]="required()"
  [invalid]="field.invalid()"
  [placeholder]="placeholder()"
  [size]="size()"
  [minDate]="minDate()"
  [maxDate]="maxDate()"
  [disabledDates]="disabledDates()"
  [disabledDays]="disabledDays()"
  [dateFormat]="dateFormat()"
  [showIcon]="showIcon()"
  [motionOptions]="motion"
  [pt]="partAttributes()"
/>
