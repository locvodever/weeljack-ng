@let name = label();
<svg
  width="1em"
  height="1em"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.viewBox]="icon().viewBox"
  [attr.role]="name ? 'img' : null"
  [attr.aria-label]="name ? name : null"
  [attr.aria-hidden]="name ? null : 'true'"
>
  @for (node of icon().nodes; track $index) {
    @switch (node[0]) {
      @case ('path') {
        <svg:path [attr.d]="node[1].d" [attr.fill]="node[1].fill" [attr.stroke]="node[1].stroke" />
      }
      @case ('circle') {
        <svg:circle
          [attr.cx]="node[1].cx"
          [attr.cy]="node[1].cy"
          [attr.r]="node[1].r"
          [attr.fill]="node[1].fill"
          [attr.stroke]="node[1].stroke"
        />
      }
      @case ('ellipse') {
        <svg:ellipse
          [attr.cx]="node[1].cx"
          [attr.cy]="node[1].cy"
          [attr.rx]="node[1].rx"
          [attr.ry]="node[1].ry"
          [attr.fill]="node[1].fill"
          [attr.stroke]="node[1].stroke"
        />
      }
      @case ('rect') {
        <svg:rect
          [attr.x]="node[1].x"
          [attr.y]="node[1].y"
          [attr.width]="node[1].width"
          [attr.height]="node[1].height"
          [attr.rx]="node[1].rx"
          [attr.ry]="node[1].ry"
          [attr.fill]="node[1].fill"
          [attr.stroke]="node[1].stroke"
        />
      }
      @case ('line') {
        <svg:line
          [attr.x1]="node[1].x1"
          [attr.y1]="node[1].y1"
          [attr.x2]="node[1].x2"
          [attr.y2]="node[1].y2"
          [attr.fill]="node[1].fill"
          [attr.stroke]="node[1].stroke"
        />
      }
      @case ('polyline') {
        <svg:polyline
          [attr.points]="node[1].points"
          [attr.fill]="node[1].fill"
          [attr.stroke]="node[1].stroke"
        />
      }
      @case ('polygon') {
        <svg:polygon
          [attr.points]="node[1].points"
          [attr.fill]="node[1].fill"
          [attr.stroke]="node[1].stroke"
        />
      }
    }
  }
</svg>
