<p-multiselect
  optionLabel="label"
  optionValue="value"
  optionDisabled="disabled"
  [filter]="false"
  [highlightOnSelect]="false"
  [options]="options()"
  [inputId]="field.id()"
  [ariaLabel]="ariaLabel()"
  [ariaLabelledBy]="field.labelledBy()"
  [disabled]="isDisabled()"
  [required]="required()"
  [invalid]="field.invalid()"
  [placeholder]="placeholder()"
  [size]="size()"
  [motionOptions]="motion"
  [pt]="partAttributes()"
/>
