<p-password
  [inputId]="field.id()"
  [ariaLabel]="ariaLabel()"
  [ariaLabelledBy]="field.labelledBy()"
  [disabled]="isDisabled()"
  [required]="required()"
  [invalid]="field.invalid()"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [feedback]="feedback()"
  [size]="size()"
  [motionOptions]="{ safe: true }"
  [pt]="partAttributes()"
/>
@if (toggleMask()) {
  <button
    type="button"
    class="wj-password-toggle"
    [attr.aria-label]="label()"
    [attr.aria-pressed]="shown()"
    [disabled]="isDisabled()"
    (click)="flip()"
  >
    @if (shown()) {
      <svg data-p-icon="eyeslash"></svg>
    } @else {
      <svg data-p-icon="eye"></svg>
    }
  </button>
}
