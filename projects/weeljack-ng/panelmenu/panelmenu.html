@let model = mapped();
@if (model.items.length > 0) {
  <p-panelmenu
    [model]="model.items"
    [multiple]="multiple()"
    [motionOptions]="motion"
    [pt]="partAttributes()"
  >
    @if (itemSlot(); as slot) {
      <ng-template #item let-item>
        @let entry = model.source(item);
        @if (entry) {
          <a
            class="p-panelmenu-item-link"
            data-pc-section="itemlink"
            tabindex="-1"
            [attr.href]="entry.url"
            [attr.target]="entry.url ? entry.target : null"
          >
            <ng-container *ngTemplateOutlet="slot.template; context: { $implicit: entry }" />
          </a>
        }
      </ng-template>
    }
  </p-panelmenu>
}
