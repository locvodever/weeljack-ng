version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      angular:
        patterns:
          - '@angular/*'
          - angular-eslint
          - ng-packagr
          - '@openng/*'
      tooling:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - angular-eslint
          - ng-packagr
          - '@openng/*'
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@openng/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript stays inside @angular/compiler-cli's range (>=6.0 <6.1): ignore every other version.
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
