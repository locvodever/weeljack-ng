name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps the release PR current; merging that PR is the release (CLAUDE.md section 9).
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The only job that runs repository code. It hands `publish` the tarball and `docs` the Pages artifact.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # No npm cache on the release build: nothing restored from a cache may reach a release artifact.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: npm audit (blocking)
        run: npm audit --audit-level=high
      - name: npm audit signatures (blocking)
        run: npm audit signatures
      # release-please names the tag weeljack-ng-vX.Y.Z (component in the tag), never vX.Y.Z.
      - name: The built version equals the tag
        run: |
          built="$(node -p "require('./dist/weeljack-ng/package.json').version")"
          expected="${TAG_NAME#weeljack-ng-v}"
          if [ "$expected" = "$TAG_NAME" ]; then
            echo "the tag $TAG_NAME does not start with weeljack-ng-v" >&2
            exit 1
          fi
          if [ "$built" != "$expected" ]; then
            echo "dist/weeljack-ng is $built but the tag is $TAG_NAME" >&2
            exit 1
          fi
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      - name: Pack the library tarball
        run: npm pack ./dist/weeljack-ng --pack-destination "$RUNNER_TEMP/tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weeljack-ng-tarball
          path: ${{ runner.temp }}/tarball/*.tgz
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs/browser

  # Publishes build's tarball through npm trusted publishing (OIDC); provenance is automatic.
  # It holds the OIDC token, so it checks nothing out, installs nothing and runs no npm script.
  # The trust link names this file (release.yml) and the Environment `npm`: rename neither.
  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # Node 26 is the .nvmrc value, written out because nothing is checked out; its npm is above
      # trusted publishing's 11.5.1 floor. No registry-url: no .npmrc and no token placeholder.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weeljack-ng-tarball
          path: ${{ runner.temp }}/tarball
      - name: npm publish (trusted publishing)
        run: npm publish "$RUNNER_TEMP"/tarball/*.tgz

  # Deploys build's Pages artifact only after npm accepted the version, so the docs match `latest`.
  docs:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
