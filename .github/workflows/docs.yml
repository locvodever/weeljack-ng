name: docs

# Run by hand from `main` with a release tag: rebuilds that tag's docs and redeploys them to Pages.
# The retry and docs-rollback path. It never touches npm.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose docs to deploy, for example weeljack-ng-v0.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # release-please names the tag weeljack-ng-vX.Y.Z (component in the tag), never vX.Y.Z.
      - name: The input is a weeljack-ng-v<major>.<minor>.<patch> tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^weeljack-ng-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag must look like weeljack-ng-v1.2.3, got: $TAG" >&2
            exit 1
          fi
        env:
          TAG: ${{ inputs.tag }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run build:docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
